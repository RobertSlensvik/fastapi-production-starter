[project]
name = "fastapi-production-starter"
version = "0.1.0"
description = "Production-ready FastAPI starter: auth, async DB, observability, Docker, CI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Slensvik" }]

dependencies = [
    # Web framework + ASGI server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21.2",

    # Config & validation
    "pydantic[email]>=2.5",
    "pydantic-settings>=2.1",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",

    # Cache + rate limiting
    "redis>=5.0",

    # Auth
    "pyjwt[crypto]>=2.8",
    "argon2-cffi>=23.1",

    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "fakeredis>=2.20",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ─── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",                # isort
    "B",                # bugbear (likely bugs)
    "UP",               # pyupgrade
    "SIM",              # simplifications
    "RUF",              # ruff-specific
    "ASYNC",            # async correctness
    "S",                # security (bandit)
    "N",                # naming conventions
]
ignore = [
    "S101",             # assert in tests is fine
    "B008",             # FastAPI Depends() is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]  # hardcoded test passwords are fine

# ─── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped loop lets us share session-scoped async fixtures (db_engine)
# across all tests in the file without "Future attached to a different loop" errors.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
]

# ─── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["src/app/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
